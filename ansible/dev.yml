---
- name: dirused Windows development VM
  hosts: all
  gather_facts: true
  vars:
    dotnet_sdk_version: "10.0.404"
    dotnet_install_dir: 'C:\Program Files\dotnet'
    git_version: "2.56.1"
    pwsh_version: "7.6.10"
    d_drive_label: "Data"

  tasks:
    - name: "Bring the raw second disk online as D: (NTFS)"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (Get-Volume -DriveLetter D -ErrorAction SilentlyContinue) { return }
          $disk = Get-Disk | Where-Object { $_.PartitionStyle -eq 'RAW' } | Select-Object -First 1
          if (-not $disk) { throw 'no D: volume and no raw disk to format' }
          Initialize-Disk -Number $disk.Number -PartitionStyle GPT
          New-Partition -DiskNumber $disk.Number -DriveLetter D -UseMaximumSize | Out-Null
          Format-Volume -DriveLetter D -FileSystem NTFS -NewFileSystemLabel '{{ d_drive_label }}' -Confirm:$false | Out-Null
          $Ansible.Changed = $true

    - name: Allow full admin tokens on admin shares for local accounts (matches the ACG targets)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: LocalAccountTokenFilterPolicy
        data: 1
        type: dword

    - name: Enable Win32 long paths
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
        name: LongPathsEnabled
        data: 1
        type: dword

    - name: Install Chocolatey
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: Install Git and PowerShell 7 (pinned)
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item.name }}"
        version: "{{ item.version }}"
        state: present
      loop:
        - { name: git, version: "{{ git_version }}" }
        - { name: powershell-core, version: "{{ pwsh_version }}" }

    - name: Read installed .NET SDKs
      ansible.windows.win_powershell:
        script: |
          $dotnet = Join-Path '{{ dotnet_install_dir }}' 'dotnet.exe'
          $Ansible.Changed = $false
          if (Test-Path $dotnet) { & $dotnet --list-sdks } else { @() }
      register: dotnet_sdks
      changed_when: false

    - name: Install .NET SDK {{ dotnet_sdk_version }} (arm64) with Microsoft's dotnet-install.ps1
      when: dotnet_sdks.output | select('search', '^' ~ (dotnet_sdk_version | regex_escape) ~ ' ') | list | length == 0
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $script = Join-Path $env:TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script
          & $script -Version '{{ dotnet_sdk_version }}' -Architecture arm64 -InstallDir '{{ dotnet_install_dir }}' -NoPath

    - name: Put .NET on the machine PATH
      ansible.windows.win_path:
        elements: '{{ dotnet_install_dir }}'
        scope: machine
        state: present

    - name: Set DOTNET_CLI_TELEMETRY_OPTOUT and DOTNET_ROOT
      ansible.windows.win_environment:
        level: machine
        variables:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_ROOT: '{{ dotnet_install_dir }}'

    - name: Work and fixture folders on both drives
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - C:\src
        - C:\dirused-fixtures
        - D:\dirused-fixtures

    - name: Report tool versions and volumes
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [pscustomobject]@{
            os      = (Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)
            arch    = $env:PROCESSOR_ARCHITECTURE
            dotnet  = (& dotnet --version)
            git     = (& git --version)
            pwsh    = (& pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
            volumes = (Get-Volume | Where-Object DriveLetter | ForEach-Object { "$($_.DriveLetter): $($_.FileSystem) $([math]::Round($_.Size/1GB))GB" }) -join ', '
            c_share = (Test-Path '\\localhost\c$\Windows')
            d_share = (Test-Path '\\localhost\d$\dirused-fixtures')
          }
      register: dev_report
      changed_when: false

    - name: Show the report
      ansible.builtin.debug:
        var: dev_report.output
